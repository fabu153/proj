name: Keep API warm

# Render's free instance sleeps after ~15 minutes without traffic, and waking it can take a minute.
# This pings /health every 10 minutes from 06:00 to 22:00 UTC (~500 instance hours a month, inside the
# free 750). Run it manually before a demo; disable the workflow to let the API sleep.
on:
  schedule:
    - cron: "*/10 6-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API until it answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 60 "https://creditlens-api-mgcf.onrender.com/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "API did not answer" && exit 1
