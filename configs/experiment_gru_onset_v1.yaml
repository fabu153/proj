# Research-only onset experiment — FROZEN before fitting. Not deployed; writes only to training/experiments/gru_onset_v1.
# Question: does a three-year GRU trained only on companies that are NOT stressed in year t detect new stress in t+1
# better than the existing onset baselines (logistic, XGBoost, MLP) and the general next-year models?
experiment: gru_onset_v1
base_config: configs/experiment_baselines_v1.yaml     # panel, row filters, chronological split + purge, preprocessing
mlp_config: configs/experiment_mlp_v1.yaml            # training loop, seeds and the 8-configuration grid are reused
baseline_experiment: baselines_v1                     # onset no-skill / rule / logistic / XGBoost test predictions
general_models:                                       # next-year models, evaluated on the same onset rows
  mlp_v1: training/experiments/mlp_v1/test_predictions_label_next_fy.csv       # deployed network (column "mlp")
  gru_history_v1: training/experiments/gru_history_v1/test_predictions.csv     # general 3-year GRU (column "gru")

target: label_onset      # canonical: stress_t == 0 (determinable) and stress in t+1 determinable; NaN otherwise.
                         # Rows whose year-t status is undeterminable are excluded, never treated as healthy.

sequence:
  years: [t-2, t-1, t]
  step_input: "31 standardized features + 31 missing-value flags (train-only Preprocessor) + years-before-t / 2"
  prior_year_rule: "same company, consecutive fiscal year (330-400 days per year back), already public when year t
                    was filed (as_of_date <= year t's as_of_date)"
  missing_years: "skipped, not zero-filled: variable-length sequences (1-3 steps) packed with
                  pack_padded_sequence; the GRU state after year t is used"

architecture: "GRU(63 -> 64), last state -> LayerNorm -> Dropout(0.25) -> Linear(64,32) -> ReLU -> Linear(32,1)"
                       # same as gru_history_v1; no architecture search
selection: "8 configurations (mlp_v1 grid) x 5 seeds; mean validation PR-AUC; mean logit of the 5 seeds"
calibration: platt on validation logits
threshold_rule: val_max_f1                            # fixed on validation, applied once to test
alert_budgets: [0.05, 0.10, 0.15, 0.20]                # share of test rows flagged, each model's top scores
bootstrap: {resamples: 1000, cluster: cik, seed: 7}

reproduce_onset_mlp: true   # mlp_v1 saved no per-row onset predictions; its onset network is retrained with the
                            # identical code and seeds and must reproduce the published test PR-AUC (0.3001)

test_set_status: >
  The 2021-2025 test window was already inspected in baselines_v1, mlp_v1, mlp_history_v1 and gru_history_v1.
  No later outcomes exist yet, so every comparison here is exploratory, not an independent confirmation.
