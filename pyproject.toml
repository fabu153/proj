[project]
name = "creditlens"
version = "1.6.2"
description = "CreditLens AI — evidence-linked credit analyst copilot (IE AI in Finance capstone)"
requires-python = ">=3.11"
# the API's runtime dependencies, as in requirements-api.txt (what the Docker image installs)
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["numpy", "pandas", "scikit-learn", "xgboost", "torch", "shap", "matplotlib", "openpyxl"]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
