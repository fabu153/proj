[project]
name = "creditlens"
version = "0.1.0"
description = "CreditLens AI — evidence-linked credit analyst copilot (IE AI in Finance capstone)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["numpy", "pandas", "scikit-learn", "xgboost", "torch", "shap", "matplotlib"]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
